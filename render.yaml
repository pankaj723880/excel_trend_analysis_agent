services:
  # -------------------------------------------------------------
  # Backend FastAPI Web Service on Render
  # -------------------------------------------------------------
  - type: web
    name: excel-trend-backend
    env: python
    region: oregon
    plan: free
    rootDir: DA/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_NAME
        value: excel_intelligence
      - key: CORS_ORIGINS
        value: "*"

  # -------------------------------------------------------------
  # Frontend React Vite Static Site on Render
  # -------------------------------------------------------------
  - type: web
    name: excel-trend-frontend
    env: static
    region: oregon
    plan: free
    rootDir: DA/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://exceltrendanalyst1.onrender.com/api
